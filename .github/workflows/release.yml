name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # macOS Native Builds (Requires CGO for Apple's IOKit)
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            ext: ""
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "1"
            ext: ""
            
          # Linux & Windows Cross-Compile (Pure Go, NO CGO required!)
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            ext: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo: "0"
            ext: ""
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: ".exe"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o baud-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: baud-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}